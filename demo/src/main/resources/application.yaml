server:
  port: 8085
spring:
  application:
    name: accounts
  datasource:
    url: jdbc:mysql://localhost:3306/accountsDB
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: accounts
  jpa:
    database: MYSQL
    show-sql: true
    hibernate:
      ddl-auto: update
#    database-platform: org.hibernate.dialect.
  profiles:
    active:
      - qa
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
