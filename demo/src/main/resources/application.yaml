server:
  port: 8085
spring:
  application:
    name: accounts
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  profiles:
    active:
      - qa
  config:
    import:
      - "optional:configserver:http://localhost:8071/"
  rabbitmq:
    port: "5672"
    host: "localhost"
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"


