services:
  micro-service-network:
    networks:
      - microservice-net
  microservice-db-config:
    image: mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 10s
      retries: 10
      interval: 10s
      start_period: 10s
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
    extends:
      service: micro-service-network
