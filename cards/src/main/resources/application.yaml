server:
  port: 8086
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
  application:
    name: cards
  profiles:
    active:
      - prod
  config:
    import:
      - "optional:configserver:http://localhost:8071"
  rabbitmq:
    port: "5672"
    host: "localhost"
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"

