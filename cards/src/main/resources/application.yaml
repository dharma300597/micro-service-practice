server:
  port: 8086
spring:
  datasource:
    url: jdbc:mysql://localhost:3308/cardsDB
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: cards
  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: update
    database: MYSQL
  application:
    name: cards
  profiles:
    active:
      - prod
  config:
    import:
      - "optional:configserver:http://localhost:8071"
#  rabbitmq:
#    port: "5672"
#    host: "localhost"
#    username: "guest"
#    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: UNRESTRICTED
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: "cards"
    description: "Bank's card Application"
    version: "1.0.0"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

logging:
  level:
    com:
      learning:
        cards: debug
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

