spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/loansDB
    username: admin
    password: loans
  jpa:
    database: MYSQL
#    hibernate:
#      ddl-auto: update
    show-sql: true
#    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: ALWAYS

  application:
    name: loans

  profiles:
    active:
      - prod
#  rabbitmq:
#    port: "5672"
#    host: "localhost"
#    username: "guest"
#    password: "guest"
  config:
    import: "optional:configserver:http://localhost:8071/"

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: UNRESTRICTED
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
info:
  app:
    name: "loans"
    description: "Bank application's loan service"
    version: "1.0.0"

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    should-unregister-on-shutdown: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"

logging:
  level:
    com:
      learning:
        loans: debug

