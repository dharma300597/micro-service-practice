spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  application:
    name: loans

  profiles:
    active:
      - prod
  rabbitmq:
    port: "5672"
    host: "localhost"
    username: "guest"
    password: "guest"
  config:
    import: "optional:configserver:http://localhost:8071/"

server:
  port: 8087

management:
  endpoints:
    web:
      exposure:
        include: "*"

